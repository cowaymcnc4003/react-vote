name: Our Jobs
on: push
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - run : echo 'Hello!'
  echo_if:
    if: github.ref_name == 'main' 
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Hello, Main'
  skip_ci:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'skip ci')
    steps:
      - run: echo 'Hello, Skip CI!'
