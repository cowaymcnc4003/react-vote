name: Our Aritifacts 2
on: push
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, GitHub Action!" > hello.txt
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: hello
          path: hello.txt
  down:
    runs-on: ubuntu-latest
    needs: up
    steps:
      - run: cat hello.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: hello
      - run: cat hello.txt
      
